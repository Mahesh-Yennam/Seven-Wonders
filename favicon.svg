<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>
  
  <!-- Architectural Pedestal & Colosseum Arches -->
  <path d="M12 48 H52 V51 H12 Z" fill="url(#gold)"/>
  <path d="M15 44 H49 V47 H15 Z" fill="url(#gold)"/>
  
  <!-- Pillars and Arches -->
  <path d="M16 43 V32 Q20 28 24 32 V43 H21 V33 Q20 31 19 33 V43 Z" fill="url(#gold)"/>
  <path d="M25 43 V30 Q32 24 39 30 V43 H36 V31 Q32 27 28 31 V43 Z" fill="url(#gold)"/>
  <path d="M40 43 V32 Q44 28 48 32 V43 H45 V33 Q44 31 43 33 V43 Z" fill="url(#gold)"/>

  <!-- Pyramid Peak / Crown -->
  <polygon points="32,13 46,27 18,27" fill="url(#gold)" opacity="0.95"/>
  <polygon points="32,13 32,27 18,27" fill="#fef08a" opacity="0.4"/>

  <!-- Star of Antiquity -->
  <circle cx="32" cy="12" r="2" fill="#ffffff"/>
</svg>
